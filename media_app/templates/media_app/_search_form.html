<form class="row g-2 align-items-center mb-4" method="GET" action="{% url 'media_app:search' %}">
    <div class="col-12 col-md-5">
        <input class="form-control form-control-lg" type="search" name="q" placeholder="Search movies, series..." aria-label="Search" value="{{ query }}">
    </div>

    <div class="col-6 col-md-2">
        <select class="form-select form-select-lg" name="genre">
            <option value="">All Genres</option>
            {% for g in genres %}
            <option value="{{ g.slug|default:g.name }}" {% if g.slug|default:g.name == selected_genre %}selected{% endif %}>{{ g.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-6 col-md-2">
        <select class="form-select form-select-lg" name="year">
            <option value="">All Years</option>
            {% for y in years %}
            <option value="{{ y }}" {% if y|stringformat:"s" == selected_year|stringformat:"s" %}selected{% endif %}>{{ y }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-12 col-md-2">
        <input class="form-control form-control-lg" type="text" name="country" placeholder="Country (optional)" value="{{ selected_country }}">
    </div>

    <div class="col-6 col-md-1">
        <select class="form-select form-select-lg" name="sort">
            <option value="recent" {% if sort == 'recent' %}selected{% endif %}>Recently Added</option>
            <option value="popular" {% if sort == 'popular' %}selected{% endif %}>Most Popular</option>
            <option value="downloads" {% if sort == 'downloads' %}selected{% endif %}>Most Downloaded</option>
            <option value="views" {% if sort == 'views' %}selected{% endif %}>Most Viewed</option>
            <option value="title" {% if sort == 'title' %}selected{% endif %}>Title</option>
        </select>
    </div>

    <div class="col-6 col-md-1">
        <button class="btn btn-primary btn-lg w-100" type="submit">
            <i class="fa-solid fa-magnifying-glass me-2"></i> Search
        </button>
    </div>
</form>
